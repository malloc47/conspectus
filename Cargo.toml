[package]
name = "conspectus"
version = "0.1.0"
edition = "2024"
license = "MIT"
description = "AI work graph status tool"

[dependencies]
anstyle = "1.0"
anyhow = "1.0"
clap = { version = "4.5", features = ["derive"] }
indexmap = { version = "2.7", features = ["serde"] }
ratatui = { version = "0.30", default-features = false, features = ["crossterm"] }
rusqlite = { version = "0.39", features = ["bundled"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
terminal_size = "0.4"
thiserror = "2.0"
toml = "0.8"
toml_edit = "0.22"
unicode-width = "0.2"

[dev-dependencies]
assert_cmd = "2.0"
insta = "1.42"
predicates = "3.1"
proptest = "1.6"
rstest = "0.24"
tempfile = "3.15"
