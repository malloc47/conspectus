[package]
name = "conspectus"
version = "0.1.0"
edition = "2024"
license = "MIT"
description = "AI work graph status tool"

[dependencies]
anyhow = "1.0"
clap = { version = "4.5", features = ["derive"] }
indexmap = { version = "2.7", features = ["serde"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "2.0"
toml = "0.8"
toml_edit = "0.22"

[dev-dependencies]
assert_cmd = "2.0"
insta = "1.42"
predicates = "3.1"
proptest = "1.6"
rstest = "0.24"
tempfile = "3.15"
