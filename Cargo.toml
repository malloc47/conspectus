# Curated clippy lints (H-HYG-005). Adds a whole-workspace
# `[lints.clippy]` table so drive-by fixes land in one place
# instead of six copies of the same pattern. Levels:
#
# - `deny`: enforced by CI (`cargo clippy -D warnings`); no
#   remaining warnings in the workspace.
# - `allow`: known targeted lint; too many current-workspace
#   warnings to fix in H-HYG-005's first landing. Follow-up
#   commits will flip these to `deny` incrementally. See the
#   H-HYG-005 backlog entry for the current counts.
#
# Consciously skipped (per audit): the doc lints (missing_docs,
# missing_errors_doc, etc.) — Conspectus has an explicit doc
# culture around ADRs and per-module `//!` headers rather than
# per-fn docs. Cast-truncation is allowed in TUI layout modules
# via per-module `#![allow]` where it's the intentional shape.
[lints.clippy]
redundant_clone = "deny"
# Deferred to H-HYG-005 follow-ups (current counts as of first
# landing): match_same_arms 36, match_wildcard_for_single_variants
# 29, uninlined_format_args 12, map_unwrap_or 69 combined.
# `match_wildcard_for_single_variants` is the most valuable to
# land next — it catches wildcards that would silently swallow
# a new `NodeKind` / `RelationKind` variant.
match_same_arms = "allow"
match_wildcard_for_single_variants = "allow"
uninlined_format_args = "allow"
map_unwrap_or = "allow"

[package]
name = "conspectus"
version = "0.1.0"
edition = "2024"
license = "MIT"
description = "AI work graph status tool"

[features]
# Dev-only `conspectus tui --snapshot` mode (ADR 0067). Renders one
# TUI frame to stdout with ANSI styling preserved so agents can
# iterate on renderer changes without a manual screenshot loop.
# Off by default; the nix dev shell and CI build with the feature
# on, while release/downstream builds leave it off.
snapshot = []

[dependencies]
ansi-to-tui = { version = "8.0.1", default-features = false }
anstyle = "1.0"
anyhow = "1.0"
chrono = { version = "0.4", default-features = false, features = ["serde", "alloc"] }
clap = { version = "4.5", features = ["derive"] }
comfy-table = { version = "7", default-features = false }
indexmap = { version = "2.7", features = ["serde"] }
# `conspectus serve` filesystem watchers (ADR 0081). Wraps
# inotify (Linux), kqueue + FSEvents (macOS), kqueue (BSD).
# Used as a latency optimization on top of interval polling;
# the daemon falls back to polling cleanly when watcher
# installation fails for any reason (rlimit, EACCES, NFS, …).
notify = { version = "8", default-features = false, features = ["macos_kqueue"] }
# Unix FFI shim for `conspectus serve`'s socket path resolution
# (getuid for the `$TMPDIR/conspectus-$UID/` fallback per
# ADR 0038). Already pulled in transitively via signal-hook +
# rusqlite; promoted to a direct dep so the daemon's socket
# code can name it explicitly. Tiny, pure-FFI, mature.
libc = "0.2"
ratatui = { version = "0.30", default-features = false, features = ["crossterm", "macros"] }
# Zero-copy archive format for the on-disk graph snapshot
# (ADR 0083). Replaces the SQLite-backed persistence layer; the
# daemon writes a single mmap-able artifact per cycle, readers
# deserialize once with bytecheck validation. The
# `serde_json::Value` payloads inside `Metadata` are handled via
# a `MetadataAsJson` adapter in `src/model/rkyv_adapters.rs` per
# the ADR 0083 amendment (option c).
rkyv = { version = "0.8", features = ["bytecheck", "alloc"] }
# mmap wrapper for the on-disk snapshot reader (ADR 0083). The
# snapshot module maps the file, validates the header + rkyv
# payload via `bytecheck`, then hands consumers an
# `&ArchivedGraphSnapshot` that borrows directly from the
# mapped pages. memmap2 is the standard idiomatic Rust mmap
# crate; tiny, mature, MIT-licensed.
memmap2 = "0.9"
# Base64 codec for the daemon socket's `snapshot` response
# (P11-006). The wire framing stays length-prefixed JSON per
# ADR 0038; binary snapshot bytes ride in a `data.bytes`
# base64 field so the protocol surface stays uniform. The
# ~4/3 size expansion is fine at conspectus's snapshot scale
# (single-digit MB); a binary-frame variant is the natural
# upgrade if snapshots ever push past the 16 MiB frame cap.
base64 = "0.22"
ratatui-cheese = "0.7"
ratatui-comfy-toaster = { version = "0.4", default-features = false }
tui-popup = "0.7"
rusqlite = { version = "0.39", features = ["bundled"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
# `conspectus serve` graceful shutdown (ADR 0080). Registers
# SIGINT/SIGTERM against an Arc<AtomicBool> the scheduler +
# socket-listener threads poll between cycles. Unix-only at the
# signal layer; the project is already single-machine /
# single-user per ADR 0036 + ADR 0038 so this is not a fresh
# portability tax.
signal-hook = "0.3"
terminal_size = "0.4"
thiserror = "2.0"
toml = "0.8"
toml_edit = "0.22"
tui-input = { version = "0.15", default-features = false, features = ["ratatui-crossterm"] }
tui-markdown = { version = "0.3", default-features = false, features = ["highlight-code"] }
unicode-width = "0.2"

[dev-dependencies]
assert_cmd = "2.0"
insta = "1.42"
# T8-044 spike: evaluating tui-pantry as a Storybook-style widget
# preview harness. Lives in dev-deps; promoted (or ripped) per the
# spike's go/no-go outcome.
tui-pantry = "0.4"
predicates = "3.1"
proptest = "1.6"
rstest = "0.24"
tempfile = "3.15"
