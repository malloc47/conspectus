name: CI

on:
  pull_request:
  push:
    branches:
      - main

env:
  CARGO_TERM_COLOR: always
  # Fail, rather than skip, the capability trace when strace is missing
  # (ADR 0117).
  CONSPECTUS_REQUIRE_STRACE: "1"

jobs:
  rust:
    name: Rust checks
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # rust-toolchain.toml pins the release (ADR 0110); install exactly it.
      - name: Read pinned Rust toolchain
        id: toolchain
        run: echo "channel=$(sed -n 's/^channel *= *"\(.*\)"/\1/p' rust-toolchain.toml)" >> "$GITHUB_OUTPUT"

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ steps.toolchain.outputs.channel }}
          components: clippy,rustfmt

      - name: Cache Cargo registry and build output
        uses: Swatinem/rust-cache@v2

      - name: Install cargo-nextest
        uses: taiki-e/install-action@nextest

      - name: Install strace
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends strace

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Run clippy
        run: cargo clippy --workspace --all-targets --all-features -- -D warnings

      # `just check` runs the tests once, through nextest; this run, with
      # each binary's tests in one process, also catches a test that fails
      # only when it shares a process with others (ADR 0224).
      - name: Run tests
        run: cargo test --workspace --all-targets --all-features

      - name: Run nextest
        run: cargo nextest run --workspace --all-targets --all-features

      # The test steps above turn the snapshot feature on, so only a build
      # without it shows the help packagers ship, which must name no
      # snapshot flag (ADR 0067). The framework gets the same features
      # from the dev-dependency, so this recompiles only the conspectus
      # crate.
      - name: Test the CLI help without the snapshot feature
        run: cargo test -p conspectus --lib cli::tests::help_text

      # The workspace steps above turn `richtext` on through the host, so
      # only a build of the framework alone catches code outside
      # `tuikit::richtext` that comes to need it. Same as `just
      # tuikit-features`.
      - name: Lint the framework with its features off and with richtext alone
        run: |
          cargo clippy -p tuikit --no-default-features -- -D warnings
          cargo clippy -p tuikit --no-default-features --all-targets -- -D warnings
          cargo clippy -p tuikit --no-default-features --features richtext -- -D warnings
          cargo clippy -p tuikit --no-default-features --features richtext --all-targets -- -D warnings

      - name: Test the framework with its features off and with richtext alone
        run: |
          cargo test -p tuikit --no-default-features
          cargo test -p tuikit --no-default-features --features richtext

      # Every step above builds with debug assertions on, so only a
      # release build compiles out what is gated on them (the dev
      # scenarios, `conspectus dev`): check one without the snapshot
      # feature, as packagers build it, and one with it, which snapshot
      # timing work needs (ADR 0067).
      - name: Check the release build with and without the snapshot feature
        run: |
          cargo check --release -p conspectus
          cargo check --release -p conspectus --features snapshot

      - name: Check docs
        run: cargo doc --workspace --no-deps
        env:
          RUSTDOCFLAGS: -D warnings

      - name: Check whitespace errors
        run: git diff --check

  # The framework crate exported with its history into a repository of its
  # own, its manifest made standalone, and its checks run there with no file
  # of this repository reachable (ADR 0199). Not path-filtered: the export
  # also reads the root manifest's workspace tables, Cargo.lock,
  # rust-toolchain.toml, LICENSE, and the script. Same as
  # `just separation-rehearsal --self-test`.
  separation-rehearsal:
    name: Separation rehearsal
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # The export keeps the crate's history.
          fetch-depth: 0

      - name: Read pinned Rust toolchain
        id: toolchain
        run: echo "channel=$(sed -n 's/^channel *= *"\(.*\)"/\1/p' rust-toolchain.toml)" >> "$GITHUB_OUTPUT"

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ steps.toolchain.outputs.channel }}
          components: clippy,rustfmt

      # The export builds in its own target directory under the runner's
      # temporary space, so only the registry is worth caching.
      - name: Cache Cargo registry
        uses: Swatinem/rust-cache@v2
        with:
          cache-targets: false

      - name: Export the framework and check it alone
        run: scripts/export-tuikit.sh --self-test "$RUNNER_TEMP/separation-rehearsal"

  # The harness plugins (ADR 0235): the opencode plugin's and the Pi
  # extension's `node --test` suites, and a type check of each against its
  # locked dependencies. Same as `just plugins`. Not path-filtered: the
  # suites replay event scripts under `tests/fixtures/hooks/` that the Rust
  # tests share. CI does not use Nix, so Node's major version is set here
  # and in `flake.nix` (`nodejs_24`); change both together.
  plugins:
    name: Plugin checks
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: |
            plugins/opencode-hook/package-lock.json
            plugins/pi-hook/package-lock.json

      - name: Install just
        uses: taiki-e/install-action@just

      - name: Test and type-check the plugins
        run: just plugins
