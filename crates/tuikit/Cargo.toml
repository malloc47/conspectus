[package]
name = "tuikit"
version = "0.1.0"
edition.workspace = true
license.workspace = true
description = "Terminal UI framework: design tokens, components, and interaction conventions on ratatui"
# Internal reuse only: no semver promise and no release pipeline.
publish = false

[lints]
workspace = true

[dev-dependencies]
# The independence guard in `tests/independence.rs` parses this manifest as
# TOML instead of guessing at its layout. `toml` is already shared through
# `[workspace.dependencies]`, so the lockfile gains no package. Every entry
# here must also be on that guard's dev-dependency allowlist.
toml = { workspace = true }
