[package]
name = "tuikit"
version = "0.1.0"
edition.workspace = true
license.workspace = true
description = "Terminal UI framework: design tokens, components, and interaction conventions on ratatui"
# Internal reuse only: no semver promise and no release pipeline.
publish = false

[lints]
workspace = true

[dependencies]
ratatui = { workspace = true }
# Cell widths for the glyph checks. Already shared through
# `[workspace.dependencies]` and in ratatui's own tree; ADR 0152 names it.
unicode-width = { workspace = true }
# The one line-edit engine, behind `text_edit::LineEdit`. Already shared
# through `[workspace.dependencies]`; ADR 0152 names it.
tui-input = { workspace = true }
# The rich-text crates, behind the `richtext` feature (ADR 0152): ANSI
# escapes into styled lines, Markdown into styled lines (the shared entry
# turns on its fenced-code highlighting, which brings its highlighter),
# and table layout. All three are already shared through
# `[workspace.dependencies]`.
ansi-to-tui = { workspace = true, optional = true }
comfy-table = { workspace = true, optional = true }
tui-markdown = { workspace = true, optional = true }

[features]
# Rich text (`tuikit::richtext`): captured terminal output laid out in a
# wrap mode, ANSI text, Markdown with tables and highlighted code, and
# syntax highlighting. Off by default, so a program that shows no rich
# content builds none of the parsing crates; a host that does turns it on
# in its dependency on the framework.
richtext = ["dep:ansi-to-tui", "dep:comfy-table", "dep:tui-markdown"]
# The test kit (`tuikit::testkit`): key scripts, the one-frame driver,
# buffer probes, the ANSI writer, style-aware goldens, the conformance
# suite, and the source-scan helpers. Off by default, so a production
# build carries none of it; a host turns it on from its dev-dependencies
# (and from any dev-only feature of its own that drives frames).
testkit = []

[dev-dependencies]
# The crate's own integration tests (the source guards) and doctests use
# the test kit, so the crate depends on itself with the feature on. This
# adds no package: it is this crate.
tuikit = { path = ".", features = ["testkit"] }
# The independence guard in `tests/independence.rs` parses this manifest as
# TOML instead of guessing at its layout. `toml` is already shared through
# `[workspace.dependencies]`, so the lockfile gains no package. Every entry
# here must also be on that guard's dev-dependency allowlist.
toml = { workspace = true }
